<svg xmlns="http://www.w3.org/2000/svg" width="900" height="306" viewBox="0 0 900 306" role="img" aria-label="About and GitHub stats">
<defs>
  <clipPath id="pc"><rect width="900" height="306"/></clipPath>

  <linearGradient id="divGrad" x1="0" x2="0"
                  gradientUnits="userSpaceOnUse"
                  y1="24" y2="294">
    <stop offset="0%"   stop-color="#1a7f37" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#1a7f37" stop-opacity="0"/>
  </linearGradient>
</defs>
<g clip-path="url(#pc)">

  <rect width="900" height="306" fill="#ffffff"/>
  <rect width="900" height="0.5" fill="#d0d7de"/>

  <text x="24" y="16"
        font-family="'Courier New',Consolas,monospace"
        font-size="9" font-weight="700" letter-spacing="2" fill="#8c959f">// ABOUT</text>
  <line x1="24" y1="24" x2="436" y2="24"
        stroke="#d0d7de" stroke-width="0.5"/>

<text x="24" y="44"
      font-family="'Courier New',Consolas,monospace"
      font-size="12.5" font-weight="700"
      fill="#1f2328">I build small systems that solve my own problems -</text>
<text x="24" y="59"
      font-family="'Courier New',Consolas,monospace"
      font-size="12.5" font-weight="700"
      fill="#1f2328">dashboards, bots, and tools nobody asked for.</text>

<text x="24" y="89"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#57606a">Informatics Engineering student at ITERA.</text>
<text x="24" y="104"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#57606a">Most of what I know came from breaking things</text>
<text x="24" y="119"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#57606a">at 3 AM and reading the error message twice.</text>
<text x="24" y="149"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#57606a">My focus leans toward web systems and automation -</text>
<text x="24" y="164"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#57606a">interfaces that stay simple, backends that stay</text>
<text x="24" y="179"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#57606a">predictable, and scripts that remove the boring part</text>
<text x="24" y="194"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#57606a">of doing the same thing forty times.</text>
<text x="24" y="224"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#57606a">I care less about looking impressive and more</text>
<text x="24" y="239"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#57606a">about whether the thing still runs tomorrow.</text>

  <line x1="24" y1="262" x2="436" y2="262"
        stroke="#e1e4e8" stroke-width="0.5"/>

  <circle cx="29" cy="269" r="2.5" fill="#1a7f37" opacity="0.75"/>
  <text x="40" y="274"
        font-family="'Courier New',Consolas,monospace" font-size="11" fill="#8c959f">Web Systems | Automation | Backend</text>
  <circle cx="29" cy="285" r="2.5" fill="#1a7f37" opacity="0.75"/>
  <text x="40" y="290"
        font-family="'Courier New',Consolas,monospace" font-size="11" fill="#8c959f">JavaScript | TypeScript | Supabase | Laravel</text>

  <rect x="456" y="24" width="1" height="270"
        fill="url(#divGrad)"/>

  <rect x="456" y="0" width="444" height="306"
        fill="#f6f8fa" opacity="0.6"/>

  <text x="480" y="16"
        font-family="'Courier New',Consolas,monospace"
        font-size="9" font-weight="700" letter-spacing="2" fill="#8c959f">// GITHUB STATS</text>
  <line x1="480" y1="24" x2="876" y2="24"
        stroke="#d0d7de" stroke-width="0.5"/>

  <text x="480" y="52"
        font-family="'Courier New',Consolas,monospace"
        font-size="10" fill="#1a7f37">◆</text>
  <text x="496" y="52"
        font-family="'Courier New',Consolas,monospace"
        font-size="10" fill="#57606a">Total Stars</text>
  <text x="876" y="52" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="20" font-weight="700" fill="#1a7f37">0</text>
  <text x="876" y="52" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="20" font-weight="700" fill="#1a7f37">0</text>
  <text x="480" y="98"
        font-family="'Courier New',Consolas,monospace"
        font-size="10" fill="#1a7f37">◆</text>
  <text x="496" y="98"
        font-family="'Courier New',Consolas,monospace"
        font-size="10" fill="#57606a">Commits (2026)</text>
  <text x="876" y="98" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="20" font-weight="700" fill="#1a7f37">118</text>
  <text x="876" y="98" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="20" font-weight="700" fill="#1a7f37">118</text>
  <text x="480" y="144"
        font-family="'Courier New',Consolas,monospace"
        font-size="10" fill="#1a7f37">◆</text>
  <text x="496" y="144"
        font-family="'Courier New',Consolas,monospace"
        font-size="10" fill="#57606a">Pull Requests</text>
  <text x="876" y="144" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="20" font-weight="700" fill="#1a7f37">10</text>
  <text x="876" y="144" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="20" font-weight="700" fill="#1a7f37">10</text>
  <text x="480" y="190"
        font-family="'Courier New',Consolas,monospace"
        font-size="10" fill="#1a7f37">!</text>
  <text x="496" y="190"
        font-family="'Courier New',Consolas,monospace"
        font-size="10" fill="#57606a">Issues</text>
  <text x="876" y="190" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="20" font-weight="700" fill="#1a7f37">0</text>
  <text x="876" y="190" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="20" font-weight="700" fill="#1a7f37">0</text>

  <rect x="690" y="232" width="88" height="20" rx="10"
        fill="#dafbe1" stroke="#d0d7de" stroke-width="0.5"/>
  <text x="734" y="245" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="9.5" font-weight="700" fill="#1a7f37">ITERA Student</text>
  <rect x="788" y="232" width="88" height="20" rx="10"
        fill="#fbefff" stroke="#d0d7de" stroke-width="0.5"/>
  <text x="832" y="245" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="9.5" font-weight="700" fill="#8250df">UTC+7 | ID</text>

  <rect x="0" y="0" width="3" height="306" fill="#1a7f37" opacity="0.7"/>

  <rect y="305" width="900" height="1" fill="#d0d7de"/>
</g>
</svg>
