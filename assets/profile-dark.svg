<svg xmlns="http://www.w3.org/2000/svg" width="900" height="306" viewBox="0 0 900 306" role="img" aria-label="About and GitHub stats">
<defs>
  <clipPath id="pc"><rect width="900" height="306"/></clipPath>
  <filter id="numGlow" x="-40%" y="-60%" width="180%" height="220%">
    <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <linearGradient id="divGrad" x1="0" x2="0"
                  gradientUnits="userSpaceOnUse"
                  y1="24" y2="294">
    <stop offset="0%"   stop-color="#39d353" stop-opacity="0.6"/>
    <stop offset="100%" stop-color="#39d353" stop-opacity="0"/>
  </linearGradient>
</defs>
<g clip-path="url(#pc)">

  <rect width="900" height="306" fill="#0a0c10"/>
  <rect width="900" height="0.5" fill="#30363d"/>

  <text x="24" y="16"
        font-family="'Courier New',Consolas,monospace"
        font-size="9" font-weight="700" letter-spacing="2" fill="#6e7681">// ABOUT</text>
  <line x1="24" y1="24" x2="436" y2="24"
        stroke="#30363d" stroke-width="0.5"/>

<text x="24" y="44"
      font-family="'Courier New',Consolas,monospace"
      font-size="12.5" font-weight="700"
      fill="#e6edf3">I build small systems that solve my own problems -</text>
<text x="24" y="59"
      font-family="'Courier New',Consolas,monospace"
      font-size="12.5" font-weight="700"
      fill="#e6edf3">dashboards, bots, and tools nobody asked for.</text>

<text x="24" y="89"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#8b949e">Informatics Engineering student at ITERA.</text>
<text x="24" y="104"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#8b949e">Most of what I know came from breaking things</text>
<text x="24" y="119"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#8b949e">at 3 AM and reading the error message twice.</text>
<text x="24" y="149"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#8b949e">My focus leans toward web systems and automation -</text>
<text x="24" y="164"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#8b949e">interfaces that stay simple, backends that stay</text>
<text x="24" y="179"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#8b949e">predictable, and scripts that remove the boring part</text>
<text x="24" y="194"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#8b949e">of doing the same thing forty times.</text>
<text x="24" y="224"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#8b949e">I care less about looking impressive and more</text>
<text x="24" y="239"
      font-family="'Courier New',Consolas,monospace"
      font-size="11" font-weight="400"
      fill="#8b949e">about whether the thing still runs tomorrow.</text>

  <line x1="24" y1="262" x2="436" y2="262"
        stroke="#21262d" stroke-width="0.5"/>

  <circle cx="29" cy="269" r="2.5" fill="#39d353" opacity="0.75"/>
  <text x="40" y="274"
        font-family="'Courier New',Consolas,monospace" font-size="11" fill="#6e7681">Web Systems | Automation | Backend</text>
  <circle cx="29" cy="285" r="2.5" fill="#39d353" opacity="0.75"/>
  <text x="40" y="290"
        font-family="'Courier New',Consolas,monospace" font-size="11" fill="#6e7681">JavaScript | TypeScript | Supabase | Laravel</text>

  <rect x="456" y="24" width="1" height="270"
        fill="url(#divGrad)"/>

  <rect x="456" y="0" width="444" height="306"
        fill="#0d1015" opacity="0.6"/>

  <text x="480" y="16"
        font-family="'Courier New',Consolas,monospace"
        font-size="9" font-weight="700" letter-spacing="2" fill="#6e7681">// GITHUB STATS</text>
  <line x1="480" y1="24" x2="876" y2="24"
        stroke="#30363d" stroke-width="0.5"/>

  <text x="480" y="52"
        font-family="'Courier New',Consolas,monospace"
        font-size="10" fill="#39d353">◆</text>
  <text x="496" y="52"
        font-family="'Courier New',Consolas,monospace"
        font-size="10" fill="#8b949e">Total Stars</text>
  <text x="876" y="52" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="20" font-weight="700" fill="#39d353"
        filter="url(#numGlow)">0</text>
  <text x="876" y="52" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="20" font-weight="700" fill="#39d353">0</text>
  <text x="480" y="98"
        font-family="'Courier New',Consolas,monospace"
        font-size="10" fill="#39d353">◆</text>
  <text x="496" y="98"
        font-family="'Courier New',Consolas,monospace"
        font-size="10" fill="#8b949e">Commits (2026)</text>
  <text x="876" y="98" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="20" font-weight="700" fill="#39d353"
        filter="url(#numGlow)">118</text>
  <text x="876" y="98" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="20" font-weight="700" fill="#39d353">118</text>
  <text x="480" y="144"
        font-family="'Courier New',Consolas,monospace"
        font-size="10" fill="#39d353">◆</text>
  <text x="496" y="144"
        font-family="'Courier New',Consolas,monospace"
        font-size="10" fill="#8b949e">Pull Requests</text>
  <text x="876" y="144" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="20" font-weight="700" fill="#39d353"
        filter="url(#numGlow)">10</text>
  <text x="876" y="144" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="20" font-weight="700" fill="#39d353">10</text>
  <text x="480" y="190"
        font-family="'Courier New',Consolas,monospace"
        font-size="10" fill="#39d353">!</text>
  <text x="496" y="190"
        font-family="'Courier New',Consolas,monospace"
        font-size="10" fill="#8b949e">Issues</text>
  <text x="876" y="190" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="20" font-weight="700" fill="#39d353"
        filter="url(#numGlow)">0</text>
  <text x="876" y="190" text-anchor="end"
        font-family="'Courier New',Consolas,monospace"
        font-size="20" font-weight="700" fill="#39d353">0</text>

  <rect x="690" y="232" width="88" height="20" rx="10"
        fill="#0d2114" stroke="#30363d" stroke-width="0.5"/>
  <text x="734" y="245" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="9.5" font-weight="700" fill="#39d353">ITERA Student</text>
  <rect x="788" y="232" width="88" height="20" rx="10"
        fill="#1a1530" stroke="#30363d" stroke-width="0.5"/>
  <text x="832" y="245" text-anchor="middle"
        font-family="'Courier New',Consolas,monospace"
        font-size="9.5" font-weight="700" fill="#d2a8ff">UTC+7 | ID</text>

  <rect x="0" y="0" width="3" height="306" fill="#39d353" opacity="0.7"/>

  <rect y="305" width="900" height="1" fill="#30363d"/>
</g>
</svg>
