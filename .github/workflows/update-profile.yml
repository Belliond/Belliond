name: Update GitHub profile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch live contribution calendar
        run: node fetch-contrib.mjs
      - name: Regenerate profile SVG
        run: node generate.mjs
      - name: Validate snapshot and SVG
        run: node validate.mjs --check-fresh
      - name: Commit changed profile files
        run: |
          node -e 'const fs=require("node:fs"),crypto=require("node:crypto"),p="README.md",r=fs.readFileSync(p,"utf8"),v=crypto.createHash("sha256").update(fs.readFileSync("assets/profile.svg")).digest("hex").slice(0,12),n=r.replace(/assets\/profile\.svg\?v=[^\s"]+/,"assets/profile.svg?v="+v); if(n===r&&!r.includes("assets/profile.svg?v="+v)) throw Error("README image URL missing"); fs.writeFileSync(p,n)'
          if git diff --quiet -- contrib.json assets/profile.svg README.md; then
            echo "Profile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib.json assets/profile.svg README.md
          git commit -m "chore: refresh live contribution profile"
          git push
