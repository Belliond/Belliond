name: Update GitHub profile

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch live contribution calendar
        run: node fetch-contrib.mjs
      - name: Regenerate profile SVG
        run: node generate.mjs
      - name: Validate snapshot and SVG
        run: node validate.mjs --check-fresh
      - name: Commit changed profile files
        run: |
          if git diff --quiet -- contrib.json assets/profile.svg; then
            echo "Profile is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib.json assets/profile.svg
          git commit -m "chore: refresh live contribution profile"
          git push
